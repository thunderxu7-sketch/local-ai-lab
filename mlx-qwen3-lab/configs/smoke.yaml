# Three steps only: verifies the training pipeline, not model quality.
model: models/Qwen3-4B-4bit
train: true
fine_tune_type: lora
data: data/smoke
seed: 42
num_layers: 4
batch_size: 1
iters: 3
val_batches: 2
learning_rate: 0.00001
steps_per_report: 1
steps_per_eval: 3
adapter_path: adapters/smoke
save_every: 3
max_seq_length: 256
grad_checkpoint: true
mask_prompt: true
report_to: null
lora_parameters:
  rank: 8
  dropout: 0.0
  scale: 16.0
